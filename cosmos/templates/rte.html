<head>
    <script src="https://js.nicedit.com/nicEdit-latest.js" type="text/javascript"></script>
    <script type="text/javascript">
        bkLib.onDomLoaded(nicEditors.allTextAreas, function() {
            var myNicEditor = new nicEditor(
                {
                    fullPanel: true
                },
                {
                    buttonList : ['fontSize','bold','italic','underline','strikeThrough','subscript','superscript','html','image', 'left', 'center', 'right', 'justify', 'ol', 'ul', 'removeformat', 'indent', 'outdent', 'hr']
                },
            );
            myNicEditor.addInstance('textarea')
        });    
    </script>
    <style>
        textarea {
            width: 100%;
        }

        .nicEdit-main {
            background-color: #d6d4d4;
        }
    </style>
</head>

<body>
    <label class="block text-neutral-100 text-sm font-bold self-start mb-2">Content*</label>
    <textarea name="content" id="textarea" cols="30" rows="10"></textarea>
</body>
