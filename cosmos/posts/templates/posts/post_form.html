{% extends "base.html" %}
{% load static %}
{% block title %} Edit Post {% endblock %}

{% block head %}
    {{ form.media }}
    <style>
        input.textinput {
            background-color: var(--primary-col);
            color: var(--text);
        }

        @media only screen and (max-width: 440px) {
            input[name='title'] {
                width: 20rem;
            }
        }

        @media only screen and (max-width: 600px) {
            input[name='title'] {
                width: 23rem;
            }
        }

        @media only screen and (min-width: 900px) {
            input[name='title'] {
                min-width: 45rem;
            }
        }

        @media only screen and (min-width: 1024px) {
            input[name='title'] {
                min-width: 50rem;
            }
        }

        input[type=submit] {
            cursor: pointer;
            width: 100%;
        }
        .p-2 {
            padding: 0.5rem;
        }

        .text-semibold {
            font-weight: 600;
        }

        .text-2xl {
            font-size:1.5rem;
            line-height:2rem;
        }

        .text-neutral-100 {
            --tw-text-opacity:1;
            color:rgb(245 245 245 / var(--tw-text-opacity))
        }

        .self-start {
            align-self: flex-start;
        }

        .border {
            border-width: 1px;
        }

        .border-gray-950 {
            --tw-border-opacity: 1;
            border-color: rgb(3 7 18 / var(--tw-border-opacity));
        }

        .mt-2 {
            margin-top: 0.5rem;
        }

        .mt-4 {
            margin-top: 1rem;
        }

        .flex {
            display: flex;
        }

        .flex-col {
            flex-direction: column;
        }

        .justify-center {
            justify-content: center;
        }

        .rounded {
            border-radius: 0.25rem;
        }

        .rounded-md {
            border-radius: 0.375rem;
        }

        .bg-green-500 {
            --tw-bg-opacity: 1;
            background-color: rgb(34 197 94 / var(--tw-bg-opacity));
        }

        .mb-2 {
            margin-bottom: 0.5rem;
        }

        .block {
            display: block;
        }

        .text-sm {
            font-size: 0.875rem;
            line-height: 1.25rem;
        }

        .font-bold {
            font-weight: 700;
        }

        .py-2 {
            padding-top:.5rem;
            padding-bottom:.5rem
        }

        .mb-2 {
          margin-bottom:.5rem
        }
        .mb-3 {
          margin-bottom:.75rem
        }
        .mt-2 {
          margin-top:.5rem
        }

        .rounded-md {
            border-radius:.375rem
        }

        @media (min-width: 768px) {
            .p-4 {
                padding: 1rem;
            }

            .md\:mt-4 {
                margin-top: 1rem;
            }
            .md\:ml-18-rem{margin-left: 18rem;}
            .md\:w-9\/12{width: 75%;}
        }

    </style>
{% endblock %}

{% block content %}
    {% load crispy_forms_tags %}
        <div class="mt-20">
            <h1 class="p-2 md:p-4 text-semibold text-2xl text-neutral-100 md:ml-18-rem">Edit Question</h1>

        <form method='POST' action='' enctype='multipart/form-data' class="p-2 md:ml-18-rem md:w-9/12 mr-4 rounded-lg h-full max-h-screen flex flex-col m-auto font-helvetica">
            {% csrf_token %}
            {% crispy form %}
        </form>
        </div>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                var labels = document.getElementsByTagName('label');
                for (var i = 0; i < labels.length; i++) {
                    labels[i].style.color = 'white';
                }
            })
        </script>
{% endblock content %}
